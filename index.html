<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E8E4DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis pedidos">
<title>Mis pedidos</title>
<meta name="description" content="Seguimiento personal de los paquetes que me tienen que llegar.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<noscript><p style="padding:24px;font:16px system-ui">Mis pedidos necesita JavaScript activado para funcionar.</p></noscript>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-caja" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8M7.5 5.5l9 5"/></symbol>
  <symbol id="i-camion" viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/></symbol>
  <symbol id="i-tienda" viewBox="0 0 24 24"><path d="M4 9h16l-1-5H5zM5 9v11h14V9M9 20v-6h6v6"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-act" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-ajus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-arch" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
</svg>

<header>
  <div class="top">
    <h1 class="titulo" id="titulo">Pedidos</h1>
    <button class="pild" id="bAct" aria-label="Actualizar ahora"><svg class="ico"><use href="#i-act"/></svg><span id="revTxt">Actualizar</span></button>
    <button class="redondo" id="bAnadir" aria-label="Añadir pedido"><svg class="ico"><use href="#i-mas"/></svg></button>
  </div>
  <p class="red-txt" id="red" hidden></p>
</header>
<div class="ptr" id="ptr" aria-hidden="true"><svg class="ico"><use href="#i-act"/></svg></div>

<main id="lista"></main>

<nav class="nav" role="tablist" aria-label="Secciones">
  <button class="on" data-tab="camino" role="tab" aria-selected="true" aria-label="En camino"><svg class="ico"><use href="#i-camion"/></svg><span class="lbl">En camino<span id="nCamino"></span></span></button>
  <button data-tab="entregados" role="tab" aria-selected="false" aria-label="Entregados"><svg class="ico"><use href="#i-ok"/></svg><span class="lbl">Entregados<span id="nEntregados"></span></span></button>
  <button id="bAjus" aria-label="Ajustes"><svg class="ico"><use href="#i-ajus"/></svg><i class="marca" id="marcaAjus" hidden></i></button>
</nav>

<div class="velo" id="velo"></div>

<!-- Añadir -->
<section class="hoja" id="hAnadir" role="dialog" aria-modal="true" aria-label="Añadir pedido">
  <div class="asa"></div>
  <div class="h-top"><h2>Nuevo pedido</h2><button class="btn-ico" data-cerrar aria-label="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <label for="aNum">Número de seguimiento</label>
  <div class="campo"><input id="aNum" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ej. 2885/11764172"><button class="mini" id="bPegar">Pegar</button></div>
  <label for="aNom">¿Qué es?</label>
  <div class="campo"><input id="aNom" maxlength="60" placeholder="Ej. Zapatillas"></div>
  <label for="aTienda">Tienda <span style="font-weight:600;color:var(--ink2)">(opcional)</span></label>
  <div class="campo"><input id="aTienda" maxlength="40" placeholder="Ej. Amazon, Zalando…"></div>
  <label>Transportista</label>
  <button class="sel" id="bTransA"><span id="aTrans">Automático (recomendado)</span><svg class="ico"><use href="#i-chev"/></svg></button>
  <p class="ayuda" id="aCupo">La empresa de transporte se detecta sola.</p>
  <button class="prim" id="bGuardar">Empezar a seguir</button>
</section>

<!-- Ficha -->
<section class="hoja" id="hFicha" role="dialog" aria-modal="true" aria-label="Detalle del pedido">
  <div class="asa"></div>
  <div class="h-top"><h2 id="fNom">Seguimiento</h2><button class="btn-ico" data-cerrar aria-label="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <div id="fCuerpo"></div>
</section>

<!-- Transportista -->
<section class="hoja" id="hTrans" role="dialog" aria-modal="true" aria-label="Elegir transportista">
  <div class="asa"></div>
  <div class="h-top"><h2>Transportista</h2><button class="btn-ico" data-cerrar aria-label="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <div class="campo"><input id="tBus" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar: Nacex, MRW, Correos Express…"></div>
  <div id="tCuerpo"></div>
</section>

<!-- Editar -->
<section class="hoja" id="hEditar" role="dialog" aria-modal="true" aria-label="Editar pedido">
  <div class="asa"></div>
  <div class="h-top"><h2>Editar</h2><button class="btn-ico" data-cerrar aria-label="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <label for="eNom">¿Qué es?</label>
  <div class="campo"><input id="eNom" maxlength="60"></div>
  <label for="eTienda">Tienda</label>
  <div class="campo"><input id="eTienda" maxlength="40"></div>
  <button class="prim" id="bGuardarEd">Guardar</button>
</section>

<!-- Ajustes -->
<section class="hoja" id="hAjus" role="dialog" aria-modal="true" aria-label="Ajustes">
  <div class="asa"></div>
  <div class="h-top"><h2>Ajustes</h2><button class="btn-ico" data-cerrar aria-label="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <label for="sUrl">Dirección del script de Google</label>
  <div class="campo"><input id="sUrl" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <label for="sClave">Contraseña</label>
  <div class="campo"><input id="sClave" type="password" autocomplete="current-password"></div>
  <button class="prim" id="bConectar">Guardar y conectar</button>
  <div class="aviso" id="sEstado">Sin conectar.</div>
  <p class="ayuda" id="sAvisos"></p>
  <p class="ayuda" id="sVer"></p>
</section>

<!-- Confirmación -->
<section class="hoja" id="hConf" role="alertdialog" aria-modal="true" aria-labelledby="cTit" aria-describedby="cTxt">
  <div class="asa"></div>
  <h2 class="conf-t" id="cTit"></h2>
  <p class="ayuda conf-p" id="cTxt"></p>
  <button class="prim peligro-lleno" id="cSi">Borrar</button>
  <button class="prim secundario" id="cNo">Cancelar</button>
</section>

<div class="toast" id="toast" role="status"></div>
<div class="nueva" id="nueva" hidden><span>Hay una versión nueva de la app.</span><button id="bRecargar">Actualizar</button></div>

<script src="app.js"></script>
</body>
</html>
